services:
  - type: web
    name: manantial
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
    # El plan gratis borra data/database.json en cada reinicio o despliegue.
    # Para conservar cuentas y progreso, cambia a plan: starter y descomenta:
    # disk:
    #   name: manantial-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # y agrega en envVars:
    # - key: DATA_DIR
    #   value: /var/data
